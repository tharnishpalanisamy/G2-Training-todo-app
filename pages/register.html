<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
    <link rel="stylesheet" href="../styles/styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css"
    />
    <style>
      body {
        background-color: whitesmoke;
      }
      .container {
        background-color: #cbeffd !important;
      }
    </style>
  </head>
  <body>
    <div class="container w-50 border rounded p-3 px-5 mt-5">
      <h2 class="text-success">CheckList Signup</h2>
      <form action="" id="signin-form">
        <div id="tabs">
          <ul class="d-flex gap-1">
            <li><a href="#tab-1">Personal Information</a></li>
            <li><a href="#tab-2">Contact Details</a></li>
            <li><a href="#tab-3">Account Details</a></li>
            <li><a href="#tab-4">Confirmation</a></li>
          </ul>
          <div id="tab-1">
            <label for="firstname"
              >Enter your first name <span class="required">*</span></label
            >
            <input
              type="text"
              class="form-control w-75 mt-1"
              id="firstname"
              placeholder="First Name"
            />
            <label for="middlename">Enter your middle name </label>
            <input
              type="text"
              class="form-control w-75 mt-1"
              id="middlename"
              placeholder="Middle Name"
            />
            <label for="lastname"
              >Enter your last name <span class="required">*</span></label
            >
            <input
              type="text"
              class="form-control w-75 mt-1"
              id="lastname"
              placeholder="Last Name"
            />
            <label for="gender" class="mt-1"
              >Select your gender <span class="required">*</span></label
            ><br />
            <label for="male">Male</label>
            <input type="radio" name="gender" id="male" value="male" />
            <label for="female">Female</label>
            <input type="radio" name="gender" id="female" value="female" />
            <label for="other">Other</label>
            <input type="radio" name="gender" id="other" value="other" /> <br />

            <label for="dob" class="mt-1"
              >Date of Birth <span class="required">*</span></label
            >
            <br />
            <input
              type="date"
              for="dob"
              id="dob"
              class="form-control w-50 mt-1"
            />

            <div class="button-container mt-2 d-flex justify-content-between">
              <a href="" class="btn btn-secondary disabled">Previous</a>
              <a href="#tab-2" class="btn btn-success" id="next1">Next</a>
            </div>
          </div>

          <!-- tab 2 -->
          <div id="tab-2">
            <div class="button-container mt-2 d-flex justify-content-between">
              <a href="" class="btn btn-secondary" id="prev1">Previous</a>
              <a href="#tab-3" class="btn btn-success" id="next2">Next</a>
            </div>
          </div>

          <!-- tab 3 -->
          <div id="tab-3">
            <div class="button-container mt-2 d-flex justify-content-between">
              <a href="" class="btn btn-secondary" id="prev2">Previous</a>
              <a href="#tab-4" class="btn btn-success" id="next3">Next</a>
            </div>
          </div>
          <!-- tab 4 -->
          <div id="tab-4">
            <div class="button-container mt-2 d-flex justify-content-between">
              <a href="" class="btn btn-secondary" id="prev3">Previous</a>
              <a href="#tab-3" class="btn btn-success" id="submitBtn">Submit</a>
            </div>
          </div>
        </div>
      </form>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"></script>
    <script>
      $(document).ready(function () {
        $("#tabs").tabs();
        $("#next1").click(function () {
          $("#tabs").tabs("option", "active", 1);
        });
      });
    </script>
  </body>
</html>
