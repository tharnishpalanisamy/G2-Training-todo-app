<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
    <link rel="stylesheet" href="../styles/styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css"
    />
  </head>
  <style>
    body {
      background-color: whitesmoke !important;
    }
    .container {
        background-color: #cbeffd !important;
    }
    a{
        text-decoration: none;
    }
  </style>
  <body>
    <div class="container w-25 border mt-lg-5 mt-2 rounded-3 p-2 px-5" >
        <h1 class="text-primary fw-bold" >Welcome!</h1> 
        <p class="text-secondary">Login to Get Started !</p>

        <form action="" class="login-form">
            <label for="username" >Username <span class="required">*</span></label> 
            <input type="text" class="form-control mt-2 w-100" id="username" placeholder="Enter your username">
            <label for="password" class="mt-2">Password <span class="required">*</span></label> 
            <input type="password" class="form-control mt-2 w-100 " id="password" placeholder="Enter your password">
            
            <a href="" class="btn btn-primary mt-4 w-100 rounded-pill">Login</a>
            <p class="text-secondary mt-2">Don't have an account? <a href="register.html" class="text-success">Register here</a></p>
        </form>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"></script>
  </body>
</html>
