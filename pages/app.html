<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHECK LIST</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="../styles/app.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand fs-2 fw-semibold brand" href="#"
          >Checklist
          <img src="../assets/favicon.ico" alt="" height="40px" width="40px"
        /></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div id="navbarSupportedContent" class="collapse navbar-collapse">
          <div
            class="d-flex w-100 align-items-center flex-column flex-lg-row align-items-lg-center"
          ></div>
          <div class="d-flex" role="search">
            <div
              class="profile-btn d-flex align-items-center gap-2"
              data-bs-toggle="offcanvas"
              data-bs-target="#profileCanvas"
              style="cursor: pointer"
            >
              <i class="fa-regular fa-circle-user fs-4 fa-lg blue"></i>
              <h5 class="name m-0"></h5>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <!--offcanvas-->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="profileCanvas">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title">
          <i class="fa-regular fa-circle-user"></i>
          Profile
        </h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
        ></button>
      </div>

      <div class="offcanvas-body">
        <div class="text-center mb-4">
          <i class="fa-regular fa-circle-user display-1 text-primary"></i>

          <h4 class="mt-3 profile blue"></h4>

          <p class="text-secondary">Welcome back 👋</p>
        </div>

        <div class="d-grid gap-3">
          <button class="btn btn-outline-primary profileBtn">
            <i class="fa-solid fa-user"></i>
            Profile
          </button>

          <button class="btn btn-danger logoutBtn">
            <span class="logout-text">
              <i class="fa-solid fa-right-from-bracket"></i>
              Logout
            </span>

            <span
              class="spinner-border spinner-border-sm d-none logout-spinner"
              role="status"
            ></span>
          </button>
        </div>
      </div>
    </div>

    <!-- app -->
    <div class="container bg-primary w-50 mt-4 p-3">
      <div id="app">
        <h3 class="text-light blue fw-bold text-center">TODO LIST</h3>
        <p class="text-secondary text-center">Manage Your Tasks Effectively</p>
        <div class="btn-container d-flex justify-content-around gap-4 mt-4">
          <div class="btn-left d-flex gap-3">
            <button class="btn btn-info text-light" id="pending-btn">
              <i class="fa-solid fa-clock"></i> pending
            </button>
            <button class="btn btn-success" id="completed-btn">
              <i class="fa-solid fa-check"></i>
              Completed
            </button>

            <button class="btn btn-warning" id="overdue-btn">
              <i class="bi bi-hourglass"></i> Overdue
            </button>
            <button class="btn btn-danger" id="DeletedTasksBtn">
              <i class="fa-solid fa-trash"></i> Deleted Tasks
            </button>
          </div>
          <div class="btn-right">
            <button
              type="button"
              class="btn btn-primary"
              data-bs-toggle="modal"
              data-bs-target="#taskModal"
            >
              + Add Task
            </button>
          </div>
        </div>
        <!-- ADD TASK MODAL -->
        <div
          class="modal fade"
          id="taskModal"
          tabindex="-1"
          aria-labelledby="exampleModalLabel"
          aria-hidden="true"
        >
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">
                  ADD TASK
                </h1>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body">
                <div id="task-form">
                  <div class="mb-3">
                    <label class="form-label" for="task-title"
                      >Title <span class="text-danger">*</span></label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id="task-title"
                      placeholder="Enter the title"
                      required
                    />
                  </div>
                  <div class="mb-3">
                    <label for="description" class="form-label"
                      >Description</label
                    >
                    <textarea
                      name="description"
                      id="description"
                      rows="2"
                      class="form-control"
                      placeholder="Enter the description"
                    ></textarea>
                  </div>
                  <div class="mb-3">
                    <label for="priority" class="form-label"
                      >Priority <span class="text-danger">*</span></label
                    >
                    <select
                      name="priority"
                      id="priority"
                      class="form-control"
                      required
                    >
                      <option value="">Select Priority</option>
                      <option value="High">High</option>
                      <option value="Medium">Medium</option>
                      <option value="Low">Low</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label for="due-date" class="form-label"
                      >Due Date <span class="text-danger">*</span></label
                    >
                    <input
                      type="date"
                      class="form-control"
                      id="due-date"
                      required
                    />
                  </div>
                  <div class="modal-footer">
                    <button
                      type="button"
                      class="btn btn-secondary"
                      data-bs-dismiss="modal"
                    >
                      Close
                    </button>
                    <button
                      type="button"
                      class="btn btn-primary"
                      id="addTaskBtn"
                    >
                      ADD Task
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- edit task -->
        <div
          class="modal fade"
          id="editTaskModal"
          tabindex="-1"
          aria-labelledby="exampleModalLabel"
          aria-hidden="true"
        >
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">
                  Edit TASK
                </h1>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>
              <div class="modal-body">
                <input type="hidden" id="edit-id" />
                <div id="task-form">
                  <div class="mb-3">
                    <label class="form-label" for="task-title"
                      >Title <span class="text-danger">*</span></label
                    >
                    <input
                      type="text"
                      class="form-control"
                      id="edit-title"
                      placeholder="Enter the title"
                      required
                    />
                  </div>
                  <div class="mb-3">
                    <label for="description" class="form-label"
                      >Description</label
                    >
                    <textarea
                      name="description"
                      id="edit-description"
                      rows="2"
                      class="form-control"
                      placeholder="Enter the description"
                    ></textarea>
                  </div>
                  <div class="mb-3">
                    <label for="priority" class="form-label"
                      >Priority <span class="text-danger">*</span></label
                    >
                    <select
                      name="priority"
                      id="edit-priority"
                      class="form-control"
                      required
                    >
                      <option value="">Select Priority</option>
                      <option value="High">High</option>
                      <option value="Medium">Medium</option>
                      <option value="Low">Low</option>
                    </select>
                  </div>

                  <div class="mb-3">
                    <label for="due-date" class="form-label"
                      >Due Date <span class="text-danger">*</span></label
                    >
                    <input
                      type="date"
                      class="form-control"
                      id="edit-due-date"
                      required
                    />
                  </div>
                  <div class="modal-footer">
                    <button
                      type="button"
                      class="btn btn-secondary"
                      data-bs-dismiss="modal"
                    >
                      Close
                    </button>
                    <button
                      type="button"
                      class="btn btn-primary"
                      id="updateTaskBtn"
                    >
                      Update Task
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- task list -->
        <div class="task-container"></div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../scripts/script.js"></script>
  </body>
</html>
